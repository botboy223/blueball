<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>QR Code Scanner / Inventory</title>
    <script src="inventory.js"></script>
</head>
<body>
    <div class="container">
        <h1>QR Code Scanner</h1>
        <div class="button-group">
            <button id="moreButton" onclick="showMoreOptions()">More</button>
        </div>

        <div id="moreOptions" class="hidden">
            <button id="option1-button" onclick="switchToOption1()">Set Barcode Values</button>
            <button id="option3-button" onclick="switchToOption3()">UPI QR Code</button>
            <button id="option4-button" onclick="switchToOption4()">Import/Export Data</button>
            <button id="option5-button" onclick="switchToOption5()">Bill History</button>
            <button id="inventory-button" onclick="showInventory()">Inventory</button>
        </div>

        <div id="inventory-section" class="option hidden">
            <h2>Inventory Management</h2>
            <table id="inventory-table">
                <tr>
                    <th>Barcode</th>
                    <th>Name</th>
                    <th>Price</th>
                    <th>Quantity</th>
                    <th>Actions</th>
                </tr>
            </table>
            <button onclick="addNewProduct()">Add Product</button>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            loadInventory();
        });

        let inventory = JSON.parse(localStorage.getItem("inventory")) || [];

        function loadInventory() {
            let table = document.getElementById("inventory-table");
            table.innerHTML = `<tr>
                <th>Barcode</th>
                <th>Name</th>
                <th>Price</th>
                <th>Quantity</th>
                <th>Actions</th>
            </tr>`;

            inventory.forEach((item, index) => {
                let row = table.insertRow();
                row.innerHTML = `
                    <td>${item.barcode}</td>
                    <td><input type="text" value="${item.name}" onchange="editInventory(${index}, 'name', this.value)"></td>
                    <td><input type="number" value="${item.price}" onchange="editInventory(${index}, 'price', this.value)"></td>
                    <td><input type="number" value="${item.quantity}" onchange="editInventory(${index}, 'quantity', this.value)"></td>
                    <td><button onclick="deleteProduct(${index})">Delete</button></td>
                `;
            });
        }

        function saveInventory() {
            localStorage.setItem("inventory", JSON.stringify(inventory));
        }

        function editInventory(index, key, value) {
            inventory[index][key] = key === 'price' || key === 'quantity' ? parseFloat(value) : value;
            saveInventory();
        }

        function deleteProduct(index) {
            inventory.splice(index, 1);
            saveInventory();
            loadInventory();
        }

        function addNewProduct() {
            let barcode = prompt("Enter Barcode:");
            let name = prompt("Enter Product Name:");
            let price = parseFloat(prompt("Enter Product Price:"));
            let quantity = parseInt(prompt("Enter Quantity:"));

            if (barcode && name && !isNaN(price) && !isNaN(quantity)) {
                inventory.push({ barcode, name, price, quantity });
                saveInventory();
                loadInventory();
            } else {
                alert("Invalid Input!");
            }
        }

        function updateInventory(barcode, quantitySold) {
            let product = inventory.find(item => item.barcode === barcode);
            if (product) {
                product.quantity -= quantitySold;
                if (product.quantity < 0) product.quantity = 0;
                saveInventory();
                loadInventory();
            }
        }

        function generateBill() {
            let cartItems = JSON.parse(localStorage.getItem("cart")) || [];
            cartItems.forEach(item => {
                updateInventory(item.barcode, item.quantity);
            });
            localStorage.setItem("cart", JSON.stringify([]));
        }

        function showInventory() {
            hideAllOptions();
            document.getElementById("inventory-section").style.display = "block";
        }
    </script>
</body>
</html>
