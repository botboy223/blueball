<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>QR Code Scanner / Reader</title>
    <style>
        .dialog {
            display: none;
            position: fixed;
            z-index: 1;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0,0,0,0.4);
        }

        .dialog-content {
            background-color: #fefefe;
            margin: 15% auto;
            padding: 20px;
            border: 1px solid #888;
            width: 80%;
            max-width: 500px;
            position: relative;
        }

        .close {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
        }

        .close:hover,
        .close:focus {
            color: black;
            text-decoration: none;
            cursor: pointer;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>QR Code Scanner</h1>
        <div class="button-group">
            <button id="moreButton" onclick="showMoreOptions()">More</button>
        </div>

        <div id="moreOptions" class="hidden">
            <button id="option1-button" onclick="switchToOption1()">Set Barcode Values</button>
            <button id="option3-button" onclick="switchToOption3()">UPI QR Code</button>
            <button id="option4-button" onclick="switchToOption4()">Import/Export Data</button>
            <button id="option5-button" onclick="switchToOption5()">Bill History</button>
            <button id="option6-button" onclick="switchToOption6()">Inventory Management</button>
            <button id="option7-button" onclick="switchToOption7()">Sales Dashboard</button>
            <button id="openDialogBtn">Download File</button>
            <button id="homePageBtn" onclick="window.location.href='https://qrwale.in/'">Home Page</button>
        </div>

        <!-- Inventory Management -->
        <div id="option6" class="content-section hidden">
            <h2>Inventory Management</h2>
            <table>
                <thead>
                    <tr>
                        <th>Barcode</th>
                        <th>Product Name</th>
                        <th>Quantity</th>
                        <th>Price</th>
                        <th>Low Stock Limit</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="inventory-list"></tbody>
            </table>
            <div class="form-group">
                <label>Initial Quantity:</label>
                <input type="number" id="product-quantity" required>
            </div>
            <div class="form-group">
                <label>Low Stock Alert (Minimum Quantity):</label>
                <input type="number" id="low-limit" value="5" required>
            </div>
        </div>

        <!-- Dashboard -->
        <div id="option7" class="content-section hidden">
            <h2>Sales Dashboard</h2>
            <div class="dashboard-stats">
                <div class="stat-card">
                    <h3>Total Sales</h3>
                    <p id="total-sales">0.00</p>
                </div>
                <div class="stat-card">
                    <h3>Today's Sales</h3>
                    <p id="today-sales">0.00</p>
                </div>
            </div>
            <div class="low-stock">
                <h3>Low Stock Alerts</h3>
                <ul id="low-stock-items"></ul>
            </div>
        </div>
    </div>

    <!-- Dialog Box -->
    <div id="dialogBox" class="dialog">
        <div class="dialog-content">
            <span id="closeDialogBtn" class="close">&times;</span>
            <p>Click the link below to download the file:</p>
            <a href="https://drive.google.com/file/d/1zDukCzjcSFB8-73XQzS8Jtc1XftueKrI/view?usp=sharing" download>Download apk</a>
        </div>
    </div>

    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://cdn.jsdelivr.net/npm/qr-code-styling/lib/qr-code-styling.js"></script>
    <script src="script.js"></script>
    <script>
        document.getElementById('openDialogBtn').addEventListener('click', function() {
            document.getElementById('dialogBox').style.display = 'block';
        });

        document.getElementById('closeDialogBtn').addEventListener('click', function() {
            document.getElementById('dialogBox').style.display = 'none';
        });

        window.addEventListener('click', function(event) {
            if (event.target === document.getElementById('dialogBox')) {
                document.getElementById('dialogBox').style.display = 'none';
            }
        });

        function showMoreOptions() {
            document.getElementById('moreOptions').classList.toggle('hidden');
        }

        function switchToOption6() {
            hideAllOptions();
            document.getElementById('option6').classList.remove('hidden');
        }

        function switchToOption7() {
            hideAllOptions();
            document.getElementById('option7').classList.remove('hidden');
        }

        function hideAllOptions() {
            document.querySelectorAll('.content-section').forEach(section => section.classList.add('hidden'));
        }
    </script>
</body>
</html>
