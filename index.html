<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Chat Bot</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f4f4f4;
        }
        #chat-container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        #chat-history {
            height: 300px;
            overflow-y: auto;
            border: 1px solid #ddd;
            padding: 10px;
            margin-bottom: 20px;
            background: #fafafa;
        }
        .message {
            margin: 5px 0;
        }
        .you { color: #2c3e50; font-weight: bold; }
        .bot { color: #2980b9; }
        #input-container {
            display: flex;
            gap: 10px;
        }
        #user-input {
            flex-grow: 1;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        button {
            padding: 8px 15px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #2980b9;
        }
    </style>
</head>
<body>
    <div id="chat-container">
        <h1>A Simple Chat Bot</h1>
        <div id="chat-history"></div>
        <div id="input-container">
            <input type="text" id="user-input" placeholder="Type your message...">
            <button onclick="sendMessage()">Get Instant Answers</button>
        </div>
    </div>

    <script type="module">
        // Import the Google Generative AI SDK
        import { GoogleGenerativeAI } from "https://esm.run/@google/generative-ai";

        // Replace with your actual Google API Key
        const API_KEY = "AIzaSyCkJdowPuIKSZEQOtjLGZqZY2hd7jM_qpI"; // Replace with your key
        const genAI = new GoogleGenerativeAI(API_KEY);
        const model = genAI.getGenerativeModel({ model: "gemini-pro" });

        // Chat history array
        let chatHistory = [];

        // Function to display chat history
        function displayChatHistory() {
            const chatDiv = document.getElementById("chat-history");
            chatDiv.innerHTML = "";
            chatHistory.forEach(([role, text]) => {
                const messageDiv = document.createElement("div");
                messageDiv.className = "message";
                messageDiv.innerHTML = `<span class="${role.toLowerCase()}">${role}:</span> ${text}`;
                chatDiv.appendChild(messageDiv);
            });
            // Scroll to the bottom
            chatDiv.scrollTop = chatDiv.scrollHeight;
        }

        // Function to get Gemini response
        async function getGeminiResponse(query) {
            try {
                const result = await model.generateContent(query);
                const response = await result.response.text();
                return response;
            } catch (error) {
                console.error("Error fetching response:", error);
                return "Sorry, something went wrong!";
            }
        }

        // Function to handle sending a message
        async function sendMessage() {
            const inputField = document.getElementById("user-input");
            const query = inputField.value.trim();

            if (query) {
                // Add user message to chat history
                chatHistory.push(["You", query]);
                displayChatHistory();

                // Clear input field
                inputField.value = "";

                // Get and display bot response
                const response = await getGeminiResponse(query);
                chatHistory.push(["Bot", response]);
                displayChatHistory();
            }
        }

        // Allow pressing Enter to send message
        document.getElementById("user-input").addEventListener("keypress", (e) => {
            if (e.key === "Enter") {
                sendMessage();
            }
        });

        // Initial display of chat history (empty at start)
        displayChatHistory();
    </script>
</body>
</html>
